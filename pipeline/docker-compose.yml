services:
    postgres:
        image: postgres:17
        container_name: cdc-postgres
        environment:
            POSTGRES_USER: cdc_user
            POSTGRES_PASSWORD: cdc_password
            POSTGRES_DB: cdc_db
        ports:
            - "5432:5432"
        command: >
            postgres
            -c wal_level=logical
        volumes:
            - ./docker-data/postgres:/var/lib/postgresql/data
            - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
        networks:
            - cdc-network

    zookeeper:
        image: confluentinc/cp-zookeeper:7.4.0
        container_name: zookeeper
        environment:
            ZOOKEEPER_CLIENT_PORT: 2181
        ports:
            - "2181:2181"
        healthcheck:
            test: nc -z localhost 2181 || exit -1
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 5s
        networks:
            - cdc-network

    kafka:
        image: confluentinc/cp-kafka:7.4.0
        container_name: kafka
        ports:
            - "9092:9092"
        environment:
            KAFKA_BROKER_ID: 1
            KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
            KAFKA_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        healthcheck:
            test: kafka-topics --bootstrap-server kafka:29092 --list
            interval: 30s
            timeout: 10s
            retries: 5
        depends_on:
            zookeeper:
                condition: service_healthy
        networks:
            - cdc-network

    schema-registry:
        image: confluentinc/cp-schema-registry:7.9.0
        hostname: schema-registry
        container_name: schema-registry
        depends_on:
            zookeeper:
                condition: service_healthy
        ports:
            - "8081:8081"
        environment:
            SCHEMA_REGISTRY_HOST_NAME: schema-registry
            SCHEMA_REGISTRY_LISTENERS: http://schema-registry:8081
            SCHEMA_REGISTRY_KAFKASTORE_CONNECTION_URL: zookeeper:2181
            SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
        restart: on-failure
        networks:
            - cdc-network

    kafka-connect:
        image: kimanikevin254/debezium-connect:3.0
        container_name: kafka-connect
        ports:
            - "8083:8083"
        environment:
            GROUP_ID: 1
            CONFIG_STORAGE_TOPIC: "connect-configs"
            OFFSET_STORAGE_TOPIC: "connect-offsets"
            STATUS_STORAGE_TOPIC: "connect-statuses"
            BOOTSTRAP_SERVERS: "kafka:29092"
            KEY_CONVERTER: io.confluent.connect.avro.AvroConverter
            VALUE_CONVERTER: io.confluent.connect.avro.AvroConverter
            CONNECT_KEY_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081 \
            CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081

        depends_on:
            kafka:
                condition: service_healthy
        networks:
            - cdc-network

    spark:
        image: kimanikevin254/spark-hudi:1.0
        container_name: spark
        ports:
            - "8080:8080"
        environment:
            SPARK_MODE: master
        volumes:
            - ${PWD}/pipeline/config-files/core-site.xml:/opt/bitnami/spark/conf/core-site.xml
        depends_on:
            kafka:
                condition: service_healthy
        networks:
            - cdc-network

    minio:
        image: quay.io/minio/minio
        container_name: minio
        ports:
            - "9000:9000"
            - "9001:9001"
        volumes:
            - ./docker-data/minio:/data
        environment:
            MINIO_ROOT_USER: minioadmin
            MINIO_ROOT_PASSWORD: minioadmin
        command: server /data --console-address ":9001"
        networks:
            - cdc-network

networks:
    cdc-network:
        driver: bridge
